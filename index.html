<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ラスペディア</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html {
    background: #f6f6f6;
}

body {
    margin: 0;
    background: #f6f6f6;
    color: #202122;
    font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "MS PMincho", serif;
    font-size: 15px;
    line-height: 1.8;
}

a {
    color: #0645ad;
    text-decoration: none;
    cursor: pointer;
}

a:hover {
    text-decoration: underline;
}

.page {
    display: flex;
    align-items: flex-start;
    min-height: 100vh;
}

.sidebar {
    width: 176px;
    flex-shrink: 0;
    padding: 14px 12px 20px 12px;
}

.logo-box {
    text-align: center;
    padding: 6px 0 16px 0;
    cursor: pointer;
}

.logo-mark {
    width: 100px;
    height: 100px;
    margin: 0 auto 8px auto;
    border-radius: 50%;
    border: 3px double #54595d;
    background: radial-gradient(circle at 35% 30%, #ffffff, #dfe6f0 70%, #c3cddd);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    font-weight: 700;
    color: #2a2a2a;
}

.logo-title {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 1px;
}

.logo-sub {
    font-size: 11px;
    color: #54595d;
}

.portlet {
    margin-bottom: 16px;
}

.portlet h3 {
    margin: 0 0 4px 0;
    padding: 4px 4px 4px 8px;
    font-size: 12px;
    font-weight: 600;
    color: #54595d;
    background: linear-gradient(to right, rgba(200, 204, 209, 0.6), rgba(200, 204, 209, 0));
}

.portlet a {
    display: block;
    padding: 3px 8px;
    font-size: 13px;
}

.content-wrap {
    flex: 1;
    min-width: 0;
    padding-top: 14px;
}

.tabs {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-left: 10px;
    height: 40px;
}

.tab {
    display: inline-block;
    padding: 9px 16px 7px 16px;
    font-size: 13px;
    background: white;
    border: 1px solid #a7d7f9;
    border-bottom: none;
    color: #202122;
}

.search-box {
    padding: 0 12px 6px 0;
}

.search-box input {
    width: 240px;
    padding: 6px 10px;
    border: 1px solid #a2a9b1;
    border-radius: 2px;
    font-family: inherit;
    font-size: 13px;
    background: white;
}

main {
    background: white;
    border: 1px solid #a7d7f9;
    padding: 22px 32px 40px 32px;
    min-height: 560px;
}

h1 {
    margin: 0 0 6px 0;
    font-size: 30px;
    font-weight: 600;
    line-height: 1.3;
    border-bottom: 1px solid #a2a9b1;
    padding-bottom: 6px;
}

h2 {
    font-size: 22px;
    font-weight: 600;
    border-bottom: 1px solid #a2a9b1;
    padding-bottom: 4px;
    margin: 28px 0 12px 0;
}

p {
    margin: 8px 0;
}

.tagline {
    font-size: 12px;
    color: #54595d;
    margin-bottom: 14px;
}

.infobox {
    float: right;
    clear: right;
    width: 270px;
    margin: 6px 0 14px 22px;
    border: 1px solid #a2a9b1;
    background: #f8f9fa;
    font-size: 13px;
    line-height: 1.6;
}

.infobox .ib-title {
    background: #cedff2;
    text-align: center;
    font-weight: 700;
    padding: 6px;
    font-size: 15px;
}

.infobox table {
    width: 100%;
    border-collapse: collapse;
}

.infobox th,
.infobox td {
    padding: 4px 8px;
    vertical-align: top;
    border-top: 1px solid #eaecf0;
    text-align: left;
}

.infobox th {
    width: 82px;
    background: #eaf3ff;
    font-weight: 600;
}

.toc {
    display: inline-block;
    border: 1px solid #a2a9b1;
    background: #f8f9fa;
    padding: 8px 18px 8px 14px;
    font-size: 13px;
    margin: 10px 0 14px 0;
    min-width: 200px;
}

.toc-title {
    text-align: center;
    font-weight: 700;
    margin-bottom: 4px;
}

.toc ol {
    margin: 0;
    padding-left: 22px;
}

.category-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.category {
    border: 1px solid #a2a9b1;
    padding: 14px;
    text-align: center;
    cursor: pointer;
    color: #0645ad;
    background: #f8f9fa;
}

.category:hover {
    background: #eaf3ff;
}

.article-item {
    padding: 9px 4px;
    border-bottom: 1px solid #eaecf0;
}

.article-category {
    color: #72777d;
    font-size: 12px;
}

.catlinks {
    clear: both;
    margin-top: 30px;
    border: 1px solid #a2a9b1;
    background: #f8f9fa;
    padding: 6px 12px;
    font-size: 13px;
}

footer {
    padding: 20px 20px 30px 190px;
    font-size: 12px;
    color: #54595d;
    line-height: 1.7;
}

@media (max-width: 800px) {
    .page {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
    }

    .logo-mark {
        width: 76px;
        height: 76px;
        font-size: 38px;
    }

    .tabs {
        height: auto;
        flex-direction: column;
        align-items: stretch;
        padding: 6px 10px;
    }

    .tab {
        align-self: flex-start;
    }

    .search-box {
        padding: 6px 0;
    }

    .search-box input {
        width: 100%;
    }

    main {
        padding: 16px;
    }

    .infobox {
        float: none;
        width: 100%;
        margin: 10px 0;
    }

    .category-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    footer {
        padding: 20px;
    }
}
</style>
</head>

<body>

<div class="page">

    <aside class="sidebar">
        <div class="logo-box" onclick="showHome()">
            <div class="logo-mark">ラ</div>
            <div class="logo-title">ラスペディア</div>
            <div class="logo-sub">ラスカルサーバー百科事典</div>
        </div>

        <div class="portlet">
            <h3>案内</h3>
            <a onclick="showHome()">メインページ</a>
        </div>

        <div class="portlet">
            <h3>カテゴリー</h3>
            <a onclick="showCategory('サーバー情報')">サーバー情報</a>
            <a onclick="showCategory('経済')">経済</a>
            <a onclick="showCategory('職業')">職業</a>
            <a onclick="showCategory('ダンジョン')">ダンジョン</a>
            <a onclick="showCategory('アイテム')">アイテム</a>
            <a onclick="showCategory('戦争')">戦争</a>
            <a onclick="showCategory('その他')">その他</a>
        </div>
    </aside>

    <div class="content-wrap">
        <div class="tabs">
            <div class="tab" id="tabMain">メインページ</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ラスペディア内を検索" oninput="searchArticles()">
            </div>
        </div>

        <main>
            <div id="content"></div>
        </main>

        <footer>
            <div>ラスペディアは、Minecraft統合版「ラスカルサーバー」の非公式ファン百科事典です。</div>
        </footer>
    </div>

</div>

<script>
const articles = [
    {
        title: "ラスカルサーバー",
        category: "サーバー情報",
        description: "Minecraft統合版のラスカルサーバーについて。",
        infobox: [
            ["種類", "Minecraft統合版サーバー"],
            ["対応版", "統合版(Bedrock Edition)"],
            ["ジャンル", "経済・職業・戦争"]
        ]
    },
    {
        title: "経済システム",
        category: "経済",
        description: "サーバー内の経済システムについて。"
    },
    {
        title: "職業一覧",
        category: "職業",
        description: "サーバー内で利用できる職業について。"
    },
    {
        title: "ダンジョン",
        category: "ダンジョン",
        description: "ダンジョンの攻略情報。"
    },
    {
        title: "アイテム一覧",
        category: "アイテム",
        description: "サーバー内のアイテムについて。"
    },
    {
        title: "戦争システム",
        category: "戦争",
        description: "戦争に関する情報。"
    }
];

const content = document.getElementById("content");
const searchInput = document.getElementById("searchInput");
const SAVE_KEY = "laspedia_last_view";

function saveView(view) {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(view));
    } catch (e) {}
}

function loadView() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        return raw ? JSON.parse(raw) : null;
    } catch (e) {
        return null;
    }
}

function setTab(label) {
    document.getElementById("tabMain").textContent = label;
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function showHome() {
    searchInput.value = "";
    setTab("メインページ");
    saveView({ type: "home" });

    content.innerHTML = `
        <h1>ラスペディアへようこそ</h1>
        <div class="tagline">ラスカルサーバーの非公式フリー百科事典</div>
        <p>ラスペディアは、Minecraft統合版「ラスカルサーバー」に関する情報をまとめる非公式の百科事典です。現在 <b>${articles.length}</b> 件の記事があります。</p>

        <h2>カテゴリーから探す</h2>
        <div class="category-grid">
            <div class="category" onclick="showCategory('サーバー情報')">サーバー情報</div>
            <div class="category" onclick="showCategory('経済')">経済</div>
            <div class="category" onclick="showCategory('職業')">職業</div>
            <div class="category" onclick="showCategory('ダンジョン')">ダンジョン</div>
            <div class="category" onclick="showCategory('アイテム')">アイテム</div>
            <div class="category" onclick="showCategory('戦争')">戦争</div>
        </div>

        <h2>記事一覧</h2>
        <div id="articleList"></div>
    `;

    renderArticles(articles);
}

function showCategory(category) {
    searchInput.value = "";
    setTab("カテゴリー");
    saveView({ type: "category", value: category });

    const filtered = articles.filter(article => article.category === category);

    content.innerHTML = `
        <h1>カテゴリー:${category}</h1>
        <div class="tagline">ラスペディアより</div>
        <p>このカテゴリーには ${filtered.length} 件の記事があります。</p>
        <div id="articleList"></div>
    `;

    renderArticles(filtered);
    window.scrollTo(0, 0);
}

function renderArticles(list) {
    const articleList = document.getElementById("articleList");

    if (!articleList) return;

    if (list.length === 0) {
        articleList.innerHTML = "<p>記事が見つかりませんでした。</p>";
        return;
    }

    articleList.innerHTML = list.map(article => {
        const index = articles.indexOf(article);
        return `
            <div class="article-item">
                <a onclick="showArticleByIndex(${index})">${article.title}</a>
                <div class="article-category">カテゴリー:${article.category}</div>
            </div>
        `;
    }).join("");
}

function showArticleByIndex(index) {
    showArticle(articles[index].title);
}

function showArticle(title) {
    const article = articles.find(item => item.title === title);
    if (!article) return;

    searchInput.value = "";
    setTab("記事");
    saveView({ type: "article", value: article.title });

    let infobox = "";
    if (article.infobox) {
        infobox = `
            <div class="infobox">
                <div class="ib-title">${article.title}</div>
                <table>
                    ${article.infobox.map(row => `<tr><th>${row[0]}</th><td>${row[1]}</td></tr>`).join("")}
                </table>
            </div>
        `;
    }

    content.innerHTML = `
        <h1>${article.title}</h1>
        <div class="tagline">ラスペディアより</div>

        ${infobox}

        <p><b>${article.title}</b>は、${article.description}</p>

        <div class="toc">
            <div class="toc-title">目次</div>
            <ol>
                <li><a onclick="scrollToId('sec-overview')">概要</a></li>
                <li><a onclick="scrollToId('sec-detail')">詳細</a></li>
                <li><a onclick="scrollToId('sec-related')">関連項目</a></li>
            </ol>
        </div>

        <h2 id="sec-overview">概要</h2>
        <p>この記事は現在作成途中です。</p>

        <h2 id="sec-detail">詳細</h2>
        <p>詳しい情報は今後追加されます。</p>

        <h2 id="sec-related">関連項目</h2>
        <p><a onclick="showCategory('${article.category}')">${article.category}</a></p>

        <div class="catlinks">カテゴリー:<a onclick="showCategory('${article.category}')">${article.category}</a></div>
    `;

    window.scrollTo(0, 0);
}

function scrollToId(id) {
    const element = document.getElementById(id);
    if (element) {
        element.scrollIntoView({ behavior: "smooth", block: "start" });
    }
}

function searchArticles() {
    const keyword = searchInput.value.trim().toLowerCase();

    if (keyword === "") {
        showHome();
        return;
    }

    setTab("検索結果");

    content.innerHTML = `
        <h1>検索結果</h1>
        <div class="tagline">ラスペディアより</div>
        <p>「${escapeHtml(keyword)}」の検索結果</p>
        <div id="articleList"></div>
    `;

    const filtered = articles.filter(article =>
        article.title.toLowerCase().includes(keyword) ||
        article.category.toLowerCase().includes(keyword) ||
        article.description.toLowerCase().includes(keyword)
    );

    renderArticles(filtered);
}

function restoreView() {
    const view = loadView();

    if (!view) {
        showHome();
        return;
    }

    if (view.type === "article") {
        showArticle(view.value);
    } else if (view.type === "category") {
        showCategory(view.value);
    } else {
        showHome();
    }
}

restoreView();
</script>

</body>
</html>
