<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ラスペディア</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #f6f6f6;
    --page: #fff;
    --text: #202122;
    --sub: #54595d;
    --link: #0645ad;
    --border: #a2a9b1;
    --line: #eaecf0;
    --bluebd: #a7d7f9;
    --box: #f8f9fa;
    --boxhead: #cedff2;
    --boxth: #eaf3ff;
    --notice: #f5faff;
    --noticebd: #a3b1bf;
    --hover: #eaf3ff;
    --input: #fff;
    --fs: 15px;
    --radius: 2px;
}

html[data-theme="dark"] {
    --bg: #101418;
    --page: #1b1f24;
    --text: #e6e8ea;
    --sub: #9aa3ad;
    --link: #6aa9ff;
    --border: #4a525c;
    --line: #2f353c;
    --bluebd: #3a4a5e;
    --box: #232830;
    --boxhead: #2a3f5c;
    --boxth: #2c333c;
    --notice: #1d2a3a;
    --noticebd: #3f536b;
    --hover: #2c333c;
    --input: #232830;
}

html[data-size="small"] { --fs: 13px; }
html[data-size="large"] { --fs: 17px; }

* { box-sizing: border-box; }

html {
    background: var(--bg);
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Serif JP", "Yu Mincho", serif;
    font-size: var(--fs);
    line-height: 1.8;
}

a {
    color: var(--link);
    text-decoration: none;
    cursor: pointer;
}

a:hover { text-decoration: underline; }

header {
    background: var(--page);
    border-bottom: 1px solid var(--bluebd);
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 22px;
}

.logo-box {
    width: 190px;
    flex-shrink: 0;
    cursor: pointer;
}

.logo-title {
    font-size: 1.7em;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.25;
}

.logo-sub {
    font-size: .75em;
    color: var(--sub);
}

.search-box {
    flex: 1;
    max-width: 560px;
    position: relative;
}

.search-box input {
    width: 100%;
    padding: 8px 36px 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--input);
    color: var(--text);
    font-family: inherit;
    font-size: 1em;
    transition: border-color .15s;
}

.search-box input:focus {
    outline: none;
    border-color: var(--link);
}

.search-box .search-icon {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--sub);
    pointer-events: none;
    font-size: .9em;
}

.layout {
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    align-items: flex-start;
    gap: 22px;
}

.sidebar {
    width: 190px;
    flex-shrink: 0;
}

.portlet {
    margin-bottom: 18px;
}

.portlet h3 {
    margin: 0 0 4px;
    padding: 4px 4px 4px 8px;
    font-size: .85em;
    font-weight: 600;
    color: var(--sub);
    border-bottom: 1px solid var(--border);
}

.portlet a {
    display: block;
    padding: 3px 8px;
    font-size: .93em;
    border-radius: var(--radius);
}

.portlet a:hover {
    background: var(--hover);
    text-decoration: none;
}

.portlet .sub-link {
    padding-left: 25px;
    font-size: .87em;
}

.content-wrap {
    flex: 1;
    min-width: 0;
}

.tab {
    display: inline-block;
    padding: 7px 18px 6px;
    font-size: .87em;
    background: var(--page);
    border: 1px solid var(--bluebd);
    border-bottom: none;
    border-radius: 3px 3px 0 0;
}

main {
    background: var(--page);
    border: 1px solid var(--bluebd);
    padding: 24px 34px 44px;
    min-height: 560px;
    border-radius: 0 2px 2px 2px;
}

.appearance {
    width: 190px;
    flex-shrink: 0;
    position: sticky;
    top: 70px;
    background: var(--page);
    border: 1px solid var(--bluebd);
    font-size: .93em;
    border-radius: var(--radius);
}

.appearance h3 {
    margin: 0;
    padding: 7px 12px;
    background: var(--boxhead);
    border-radius: var(--radius) var(--radius) 0 0;
}

.ap-group {
    padding: 10px 12px;
    border-top: 1px solid var(--line);
}

.ap-label {
    font-size: .85em;
    font-weight: 700;
    color: var(--sub);
    margin-bottom: 6px;
}

.ap-buttons {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.ap-buttons button {
    padding: 6px 10px;
    text-align: left;
    font-family: inherit;
    color: var(--text);
    background: var(--box);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: background .15s, border-color .15s;
}

.ap-buttons button:hover {
    background: var(--hover);
}

.ap-buttons button.active {
    background: var(--boxhead);
    border-color: var(--link);
    font-weight: 700;
}

h1 {
    margin: 0 0 6px;
    font-size: 2em;
    font-weight: 600;
    line-height: 1.3;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
}

h2 {
    font-size: 1.45em;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
    margin: 28px 0 12px;
}

h3 {
    font-size: 1.15em;
    margin: 20px 0 8px;
}

p { margin: 8px 0; }

.tagline {
    font-size: .8em;
    color: var(--sub);
    margin-bottom: 14px;
}

.hatnote {
    font-size: .87em;
    color: var(--sub);
    padding-left: 20px;
    margin-bottom: 10px;
    font-style: italic;
}

.notice {
    border: 1px solid var(--noticebd);
    background: var(--notice);
    padding: 12px 16px;
    margin: 12px 0 18px;
    border-radius: var(--radius);
}

.infobox {
    float: right;
    clear: right;
    width: 18em;
    margin: 6px 0 14px 22px;
    border: 1px solid var(--border);
    background: var(--box);
    font-size: .9em;
    line-height: 1.6;
    border-radius: var(--radius);
    overflow: hidden;
}

.ib-title {
    background: var(--boxhead);
    text-align: center;
    font-weight: 700;
    font-size: 1.1em;
    padding: 6px;
}

.infobox table {
    width: 100%;
    border-collapse: collapse;
}

.infobox th,
.infobox td {
    padding: 4px 8px;
    vertical-align: top;
    border-top: 1px solid var(--line);
    text-align: left;
}

.infobox th {
    width: 6em;
    background: var(--boxth);
    font-weight: 600;
}

.category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
}

.category {
    border: 1px solid var(--border);
    padding: 14px 12px;
    text-align: center;
    cursor: pointer;
    color: var(--link);
    background: var(--box);
    border-radius: var(--radius);
    transition: background .15s, border-color .15s;
}

.category:hover {
    background: var(--hover);
    border-color: var(--link);
}

.article-item {
    padding: 9px 4px;
    border-bottom: 1px solid var(--line);
}

.article-item:last-child {
    border-bottom: none;
}

.article-category {
    color: var(--sub);
    font-size: .8em;
}

.toc {
    display: table;
    min-width: 220px;
    max-width: 100%;
    border: 1px solid var(--border);
    background: var(--box);
    padding: 8px 16px;
    margin: 16px 0 22px;
    border-radius: var(--radius);
}

.toc-title {
    text-align: center;
    font-weight: 700;
}

.toc ol {
    margin: 4px 0;
    padding-left: 1.4em;
}

.toc li {
    margin: 2px 0;
}

.catlinks {
    clear: both;
    margin-top: 30px;
    border: 1px solid var(--border);
    background: var(--box);
    padding: 6px 12px;
    font-size: .87em;
    border-radius: var(--radius);
}

.breadcrumb {
    font-size: .8em;
    color: var(--sub);
    margin-bottom: 8px;
}

footer {
    padding: 20px 4px 30px;
    font-size: .8em;
    color: var(--sub);
}

.mobile-menu {
    display: none;
    width: 100%;
    padding: 8px;
    background: var(--box);
    color: var(--text);
    border: 1px solid var(--border);
    font-family: inherit;
    border-radius: var(--radius);
    cursor: pointer;
    margin-bottom: 10px;
}

.search-result-count {
    font-size: .9em;
    color: var(--sub);
    margin-bottom: 12px;
}

@media (max-width: 1000px) {
    .layout {
        flex-direction: column;
        padding: 12px;
    }

    .sidebar,
    .appearance {
        width: 100%;
    }

    .appearance {
        position: static;
        order: 3;
    }

    .ap-buttons {
        flex-direction: row;
        flex-wrap: wrap;
    }

    .header-inner {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
    }

    .logo-box {
        width: 100%;
        text-align: center;
    }

    .search-box {
        max-width: none;
    }

    main {
        padding: 16px;
    }

    .infobox {
        float: none;
        width: 100%;
        margin: 10px 0;
    }

    .mobile-menu {
        display: block;
    }

    .sidebar.mobile-hidden .portlet {
        display: none;
    }

    .category-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 480px) {
    .category-grid {
        grid-template-columns: 1fr;
    }
}

/* スマホ対応: メニューは下に回し、タップしやすくする */
@media (max-width: 1000px) {
    .content-wrap {
        order: 1;
        width: 100%;
    }

    .appearance {
        order: 2;
    }

    .sidebar {
        order: 3;
        width: 100%;
    }

    .portlet a {
        padding: 10px 8px;
    }

    .search-box input {
        font-size: 16px;
    }

    .toc {
        display: block;
    }

    main {
        min-height: 0;
    }
}
</style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="logo-box" onclick="showHome()">
            <div class="logo-title">ラスペディア</div>
            <div class="logo-sub">ラスカルサーバー百科事典</div>
        </div>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="ラスペディア内を検索"
                oninput="searchArticles()"
                autocomplete="off"
            >
            <span class="search-icon">🔍</span>
        </div>
    </div>
</header>

<div class="layout">

    <aside class="sidebar" id="sidebar">

        <button class="mobile-menu" onclick="toggleSidebar()">
            メニューを開く / 閉じる
        </button>

        <div class="portlet">
            <h3>案内</h3>
            <a onclick="showHome()">メインページ</a>
        </div>

        <div class="portlet">
            <h3>ラスカルサーバー</h3>
            <a onclick="showArticle('ラスカルサーバーとは')">ラスカルサーバーとは</a>
        </div>

        <div class="portlet">
            <h3>クエスト</h3>
            <a onclick="showList('quest')">クエスト</a>
            <a class="sub-link" onclick="showArticle('デイリークエスト')">デイリークエスト</a>
            <a class="sub-link" onclick="showArticle('ウィークリークエスト')">ウィークリークエスト</a>
        </div>

        <div class="portlet">
            <h3>ゲームシステム</h3>
            <a onclick="showArticle('ジョブ')">ジョブ</a>
            <a onclick="showList('occupation')">職業</a>
            <a onclick="showList('skill')">スキル</a>
            <a onclick="showArticle('ダンジョン')">ダンジョン</a>
            <a onclick="showArticle('勢力')">勢力</a>
            <a onclick="showArticle('戦争')">戦争</a>
        </div>

    </aside>

    <div class="content-wrap">

        <div class="tab" id="tabMain">メインページ</div>

        <main>
            <div id="content"></div>
        </main>

        <footer>
            ラスペディアは、Minecraft統合版「ラスカルサーバー」の非公式ファン百科事典です。
        </footer>

    </div>

    <aside class="appearance">
        <h3>外観</h3>

        <div class="ap-group">
            <div class="ap-label">テキスト</div>
            <div class="ap-buttons">
                <button data-size-btn="small" onclick="setSize('small')">小</button>
                <button data-size-btn="standard" onclick="setSize('standard')">標準</button>
                <button data-size-btn="large" onclick="setSize('large')">大</button>
            </div>
        </div>

        <div class="ap-group">
            <div class="ap-label">色</div>
            <div class="ap-buttons">
                <button data-theme-btn="light" onclick="setTheme('light')">ライト</button>
                <button data-theme-btn="dark" onclick="setTheme('dark')">ダーク</button>
            </div>
        </div>
    </aside>

</div>

<script src="data/system/server.js"></script>
<script src="data/system/quest.js"></script>
<script src="data/system/job.js"></script>
<script src="data/system/occupation.js"></script>
<script src="data/system/skill.js"></script>
<script src="data/system/dungeon.js"></script>
<script src="data/system/faction.js"></script>
<script src="data/system/war.js"></script>

<script>
const content = document.getElementById("content");
const searchInput = document.getElementById("searchInput");
const PREF_KEY = "laspedia_appearance";

function getAllArticles() {
    const data = window.LaspediaData || {};
    const list = [];
    for (const key of Object.keys(data)) {
        if (Array.isArray(data[key])) {
            list.push(...data[key]);
        }
    }
    return list;
}

function loadPref() {
    try {
        const saved = JSON.parse(localStorage.getItem(PREF_KEY));
        return {
            size: saved?.size || "standard",
            theme: saved?.theme || "light"
        };
    } catch (e) {
        return { size: "standard", theme: "light" };
    }
}

let pref = loadPref();

function savePref() {
    localStorage.setItem(PREF_KEY, JSON.stringify(pref));
}

function applyPref() {
    document.documentElement.setAttribute("data-size", pref.size);
    document.documentElement.setAttribute("data-theme", pref.theme);

    document.querySelectorAll("[data-size-btn]").forEach(button => {
        button.classList.toggle("active", button.dataset.sizeBtn === pref.size);
    });

    document.querySelectorAll("[data-theme-btn]").forEach(button => {
        button.classList.toggle("active", button.dataset.themeBtn === pref.theme);
    });
}

function setSize(value) {
    pref.size = value;
    savePref();
    applyPref();
}

function setTheme(value) {
    pref.theme = value;
    savePref();
    applyPref();
}

function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("mobile-hidden");
}

function setTab(label) {
    document.getElementById("tabMain").textContent = label;
}

function escapeHtml(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function showHome() {
    searchInput.value = "";
    setTab("メインページ");

    content.innerHTML = `
        <h1>ラスペディアへようこそ</h1>

        <div class="tagline">
            出典: フリー百科事典『ラスペディア』
        </div>

        <div class="notice">
            <b>ラスペディア</b>は、Minecraft統合版「ラスカルサーバー」に関する情報をまとめる非公式の百科事典です。
            サーバーのシステムやゲーム情報などを紹介しています。
        </div>

        <h2>ラスカルサーバー</h2>
        <div class="category-grid">
            <div class="category" onclick="showArticle('ラスカルサーバーとは')">ラスカルサーバーとは</div>
        </div>

        <h2>クエスト</h2>
        <div class="category-grid">
            <div class="category" onclick="showList('quest')">クエスト一覧</div>
            <div class="category" onclick="showArticle('デイリークエスト')">デイリークエスト</div>
            <div class="category" onclick="showArticle('ウィークリークエスト')">ウィークリークエスト</div>
        </div>

        <h2>ゲームシステム</h2>
        <div class="category-grid">
            <div class="category" onclick="showArticle('ジョブ')">ジョブ</div>
            <div class="category" onclick="showList('occupation')">職業</div>
            <div class="category" onclick="showList('skill')">スキル</div>
            <div class="category" onclick="showArticle('ダンジョン')">ダンジョン</div>
            <div class="category" onclick="showArticle('勢力')">勢力</div>
            <div class="category" onclick="showArticle('戦争')">戦争</div>
        </div>

        <h2>記事一覧</h2>
        <div id="articleList"></div>
    `;

    renderArticles(getAllArticles());
    window.scrollTo(0, 0);
}

function renderArticles(list) {
    const articleList = document.getElementById("articleList");
    if (!articleList) return;

    if (list.length === 0) {
        articleList.innerHTML = "<p>記事が見つかりませんでした。</p>";
        return;
    }

    articleList.innerHTML = list.map(article => `
        <div class="article-item">
            <a onclick="showArticle('${escapeHtml(article.title)}')">${escapeHtml(article.title)}</a>
            <div class="article-category">${escapeHtml(article.category)}</div>
        </div>
    `).join("");
}

function showArticle(title) {
    const articles = getAllArticles();
    const article = articles.find(item => item.title === title);
    if (!article) return;

    searchInput.value = "";
    setTab(article.title);

    const sections = article.sections || [];
    const tocItems = ["概要", ...sections.map(s => s.title), "関連項目"];

    let infobox = "";
    if (article.infobox) {
        infobox = `
            <div class="infobox">
                <div class="ib-title">${escapeHtml(article.title)}</div>
                <table>
                    ${article.infobox.map(row => `
                        <tr>
                            <th>${escapeHtml(row[0])}</th>
                            <td>${escapeHtml(row[1])}</td>
                        </tr>
                    `).join("")}
                </table>
            </div>
        `;
    }

    content.innerHTML = `
        <div class="breadcrumb">
            <a onclick="showHome()">メインページ</a>
            ＞ ${escapeHtml(article.category)}
        </div>

        <h1>${escapeHtml(article.title)}</h1>

        <div class="tagline">
            出典: フリー百科事典『ラスペディア』
        </div>

        <div class="hatnote">
            この記事はラスカルサーバーに関する情報をまとめた記事です。
        </div>

        ${infobox}

        <p><b>${escapeHtml(article.title)}</b>は、${escapeHtml(article.description)}</p>

        <div class="toc">
            <div class="toc-title">目次</div>
            <ol>
                ${tocItems.map((item, index) => `
                    <li><a onclick="scrollToId('section-${index}')">${escapeHtml(item)}</a></li>
                `).join("")}
            </ol>
        </div>

        <h2 id="section-0">概要</h2>
        <p>${escapeHtml(article.description)}</p>

        ${sections.map((section, index) => `
            <h2 id="section-${index + 1}">${escapeHtml(section.title)}</h2>
            <p>${escapeHtml(section.text)}</p>
        `).join("")}

        <h2 id="section-${sections.length + 1}">関連項目</h2>
        <ul>
            ${articles
                .filter(item => item.title !== article.title && item.category === article.category)
                .map(item => `
                    <li>
                        <a onclick="showArticle('${escapeHtml(item.title)}')">${escapeHtml(item.title)}</a>
                    </li>
                `).join("")}
        </ul>

        <div class="catlinks">
            カテゴリー: ${escapeHtml(article.category)}
        </div>
    `;

    window.scrollTo(0, 0);
}

function scrollToId(id) {
    const element = document.getElementById(id);
    if (element) {
        element.scrollIntoView({ behavior: "smooth", block: "start" });
    }
}

function showList(key) {
    const titles = {
        quest: "クエスト",
        occupation: "職業",
        skill: "スキル"
    };
    const title = titles[key] || "一覧";
    const list = (window.LaspediaData || {})[key] || [];

    searchInput.value = "";
    setTab(title + "一覧");

    content.innerHTML = `
        <div class="breadcrumb">
            <a onclick="showHome()">メインページ</a>
            ＞ ${escapeHtml(title)}
        </div>

        <h1>${escapeHtml(title)}一覧</h1>

        <div class="tagline">
            出典: フリー百科事典『ラスペディア』
        </div>

        <p>${escapeHtml(title)}に関する記事の一覧です。見たい記事を選んでください。</p>

        <div id="articleList"></div>
    `;

    renderArticles(list);
    window.scrollTo(0, 0);
}

function searchArticles() {
    const keyword = searchInput.value.trim().toLowerCase();

    if (keyword === "") {
        showHome();
        return;
    }

    setTab("検索結果");
    const articles = getAllArticles();

    const filtered = articles.filter(article =>
        article.title.toLowerCase().includes(keyword) ||
        article.category.toLowerCase().includes(keyword) ||
        article.description.toLowerCase().includes(keyword) ||
        (article.sections || []).some(section =>
            section.title.toLowerCase().includes(keyword) ||
            section.text.toLowerCase().includes(keyword)
        )
    );

    content.innerHTML = `
        <h1>検索結果</h1>
        <div class="tagline">出典: フリー百科事典『ラスペディア』</div>
        <p class="search-result-count">「${escapeHtml(keyword)}」の検索結果：${filtered.length}件</p>
        <div id="articleList"></div>
    `;

    renderArticles(filtered);
}

applyPref();
showHome();
</script>

</body>
</html>
