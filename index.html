<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ラスペディア</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f2e7;
    color: #2a2622;
    font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "MS PMincho", serif;
    font-size: 16px;
    line-height: 1.9;
}

a {
    color: #2b3a67;
    cursor: pointer;
    text-decoration: none;
}

a:hover {
    color: #b23a2e;
}

header {
    background: #2b3a67;
    color: #f7f2e7;
    padding: 26px 20px 22px 20px;
    text-align: center;
    border-bottom: 4px solid #b23a2e;
}

.brand {
    display: inline-block;
    cursor: pointer;
}

.brand-title {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 8px;
    padding-left: 8px;
    line-height: 1.3;
}

.brand-sub {
    font-size: 13px;
    letter-spacing: 4px;
    opacity: 0.8;
}

.searchbar {
    margin-top: 16px;
}

.searchbar input {
    width: 100%;
    max-width: 460px;
    padding: 10px 16px;
    border: none;
    border-radius: 30px;
    font-family: inherit;
    font-size: 15px;
    background: #fffdf8;
    color: #2a2622;
    outline: none;
}

nav {
    background: #efe7d3;
    border-bottom: 1px solid #d6c9a8;
    padding: 10px 16px;
    text-align: center;
}

nav a {
    display: inline-block;
    margin: 3px 6px;
    padding: 4px 14px;
    font-size: 14px;
    border: 1px solid #b8a97f;
    border-radius: 3px;
    background: #fbf8ef;
}

nav a:hover {
    background: #2b3a67;
    color: #f7f2e7;
    border-color: #2b3a67;
}

main {
    max-width: 860px;
    margin: 28px auto;
    background: #fffdf8;
    border: 1px solid #d6c9a8;
    box-shadow: 0 3px 0 #e3d8bc;
    padding: 34px 44px 44px 44px;
    min-height: 480px;
}

h1 {
    margin: 0 0 8px 0;
    font-size: 32px;
    font-weight: 900;
    line-height: 1.4;
    padding-left: 14px;
    border-left: 8px solid #b23a2e;
}

h2 {
    margin: 34px 0 10px 0;
    font-size: 21px;
    font-weight: 700;
    color: #2b3a67;
    padding-bottom: 4px;
    border-bottom: 2px solid #2b3a67;
}

p {
    margin: 10px 0;
}

.tag {
    display: inline-block;
    margin: 4px 0 14px 22px;
    padding: 0 12px;
    font-size: 12px;
    color: #b23a2e;
    border: 1px solid #b23a2e;
    border-radius: 20px;
}

.lead {
    font-size: 17px;
    padding: 12px 18px;
    margin: 14px 0;
    background: #f7f2e7;
    border-left: 4px solid #2b3a67;
}

.card {
    float: right;
    width: 250px;
    margin: 6px 0 16px 24px;
    border: 1px solid #b8a97f;
    background: #fbf8ef;
    font-size: 14px;
    line-height: 1.7;
}

.card-title {
    background: #2b3a67;
    color: #f7f2e7;
    text-align: center;
    padding: 6px;
    font-weight: 700;
}

.card table {
    width: 100%;
    border-collapse: collapse;
}

.card th,
.card td {
    padding: 5px 10px;
    text-align: left;
    vertical-align: top;
    border-top: 1px solid #e3d8bc;
}

.card th {
    width: 84px;
    color: #b23a2e;
    font-weight: 600;
}

.toc {
    display: inline-block;
    min-width: 220px;
    margin: 10px 0;
    padding: 10px 24px 10px 18px;
    border: 1px dashed #b8a97f;
    background: #fbf8ef;
    font-size: 14px;
}

.toc-title {
    font-weight: 700;
    margin-bottom: 2px;
    color: #2b3a67;
}

.toc ol {
    margin: 0;
    padding-left: 22px;
}

.category-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 12px;
}

.category {
    padding: 16px 10px;
    text-align: center;
    cursor: pointer;
    color: #2b3a67;
    font-weight: 600;
    border: 1px solid #b8a97f;
    border-top: 4px solid #2b3a67;
    background: #fbf8ef;
}

.category:hover {
    background: #2b3a67;
    color: #f7f2e7;
}

.article-item {
    padding: 11px 6px;
    border-bottom: 1px dotted #b8a97f;
}

.article-item a {
    font-size: 17px;
    font-weight: 600;
}

.article-category {
    font-size: 12px;
    color: #8a7f66;
}

.back {
    clear: both;
    margin-top: 34px;
    padding-top: 12px;
    border-top: 1px solid #d6c9a8;
    font-size: 14px;
}

footer {
    text-align: center;
    padding: 10px 20px 36px 20px;
    font-size: 12px;
    color: #8a7f66;
}

@media (max-width: 700px) {
    header {
        padding: 20px 14px 18px 14px;
    }

    .brand-title {
        font-size: 30px;
        letter-spacing: 5px;
    }

    main {
        margin: 14px 10px;
        padding: 20px 18px 30px 18px;
    }

    h1 {
        font-size: 25px;
    }

    .card {
        float: none;
        width: 100%;
        margin: 10px 0;
    }

    .category-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="brand" onclick="showHome()">
        <div class="brand-title">ラスペディア</div>
        <div class="brand-sub">ラスカルサーバー百科</div>
    </div>
    <div class="searchbar">
        <input type="text" id="searchInput" placeholder="記事を検索..." oninput="searchArticles()">
    </div>
</header>

<nav>
    <a onclick="showHome()">ホーム</a>
    <a onclick="showCategory('サーバー情報')">サーバー情報</a>
    <a onclick="showCategory('経済')">経済</a>
    <a onclick="showCategory('職業')">職業</a>
    <a onclick="showCategory('ダンジョン')">ダンジョン</a>
    <a onclick="showCategory('アイテム')">アイテム</a>
    <a onclick="showCategory('戦争')">戦争</a>
    <a onclick="showCategory('その他')">その他</a>
</nav>

<main>
    <div id="content"></div>
</main>

<footer>ラスペディア | ラスカルサーバー非公式ファン百科</footer>

<script>
const articles = [
    {
        title: "ラスカルサーバー",
        category: "サーバー情報",
        description: "Minecraft統合版のラスカルサーバーについて。",
        card: [
            ["種類", "Minecraft統合版サーバー"],
            ["対応版", "統合版(Bedrock)"],
            ["ジャンル", "経済・職業・戦争"]
        ]
    },
    {
        title: "経済システム",
        category: "経済",
        description: "サーバー内の経済システムについて。"
    },
    {
        title: "職業一覧",
        category: "職業",
        description: "サーバー内で利用できる職業について。"
    },
    {
        title: "ダンジョン",
        category: "ダンジョン",
        description: "ダンジョンの攻略情報。"
    },
    {
        title: "アイテム一覧",
        category: "アイテム",
        description: "サーバー内のアイテムについて。"
    },
    {
        title: "戦争システム",
        category: "戦争",
        description: "戦争に関する情報。"
    }
];

const content = document.getElementById("content");
const searchInput = document.getElementById("searchInput");
const SAVE_KEY = "laspedia_last_view";

function saveView(view) {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(view));
    } catch (e) {}
}

function loadView() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        return raw ? JSON.parse(raw) : null;
    } catch (e) {
        return null;
    }
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function showHome() {
    searchInput.value = "";
    saveView({ type: "home" });

    content.innerHTML = `
        <h1>ラスペディアへようこそ</h1>
        <div class="lead">ここは、Minecraft統合版「ラスカルサーバー」のことをみんなでまとめていく非公式の百科事典です。現在 ${articles.length} 件の記事があります。</div>

        <h2>カテゴリー</h2>
        <div class="category-grid">
            <div class="category" onclick="showCategory('サーバー情報')">サーバー情報</div>
            <div class="category" onclick="showCategory('経済')">経済</div>
            <div class="category" onclick="showCategory('職業')">職業</div>
            <div class="category" onclick="showCategory('ダンジョン')">ダンジョン</div>
            <div class="category" onclick="showCategory('アイテム')">アイテム</div>
            <div class="category" onclick="showCategory('戦争')">戦争</div>
        </div>

        <h2>記事一覧</h2>
        <div id="articleList"></div>
    `;

    renderArticles(articles);
}

function showCategory(category) {
    searchInput.value = "";
    saveView({ type: "category", value: category });

    const filtered = articles.filter(article => article.category === category);

    content.innerHTML = `
        <h1>${category}</h1>
        <p>「${category}」に関する記事が ${filtered.length} 件あります。</p>
        <div id="articleList"></div>
    `;

    renderArticles(filtered);
    window.scrollTo(0, 0);
}

function renderArticles(list) {
    const articleList = document.getElementById("articleList");

    if (!articleList) return;

    if (list.length === 0) {
        articleList.innerHTML = "<p>記事が見つかりませんでした。</p>";
        return;
    }

    articleList.innerHTML = list.map(article => {
        const index = articles.indexOf(article);
        return `
            <div class="article-item">
                <a onclick="showArticleByIndex(${index})">${article.title}</a>
                <div class="article-category">${article.category}</div>
            </div>
        `;
    }).join("");
}

function showArticleByIndex(index) {
    showArticle(articles[index].title);
}

function showArticle(title) {
    const article = articles.find(item => item.title === title);
    if (!article) return;

    searchInput.value = "";
    saveView({ type: "article", value: article.title });

    let card = "";
    if (article.card) {
        card = `
            <div class="card">
                <div class="card-title">${article.title}</div>
                <table>
                    ${article.card.map(row => `<tr><th>${row[0]}</th><td>${row[1]}</td></tr>`).join("")}
                </table>
            </div>
        `;
    }

    content.innerHTML = `
        <h1>${article.title}</h1>
        <span class="tag">${article.category}</span>

        ${card}

        <div class="lead">${article.description}</div>

        <div class="toc">
            <div class="toc-title">目次</div>
            <ol>
                <li><a onclick="scrollToId('sec-overview')">概要</a></li>
                <li><a onclick="scrollToId('sec-detail')">詳細</a></li>
                <li><a onclick="scrollToId('sec-related')">関連項目</a></li>
            </ol>
        </div>

        <h2 id="sec-overview">概要</h2>
        <p>この記事は現在作成途中です。</p>

        <h2 id="sec-detail">詳細</h2>
        <p>詳しい情報は今後追加されます。</p>

        <h2 id="sec-related">関連項目</h2>
        <p><a onclick="showCategory('${article.category}')">${article.category}</a></p>

        <div class="back"><a onclick="showHome()">← ホームに戻る</a></div>
    `;

    window.scrollTo(0, 0);
}

function scrollToId(id) {
    const element = document.getElementById(id);
    if (element) {
        element.scrollIntoView({ behavior: "smooth", block: "start" });
    }
}

function searchArticles() {
    const keyword = searchInput.value.trim().toLowerCase();

    if (keyword === "") {
        showHome();
        return;
    }

    content.innerHTML = `
        <h1>検索結果</h1>
        <p>「${escapeHtml(keyword)}」の検索結果</p>
        <div id="articleList"></div>
    `;

    const filtered = articles.filter(article =>
        article.title.toLowerCase().includes(keyword) ||
        article.category.toLowerCase().includes(keyword) ||
        article.description.toLowerCase().includes(keyword)
    );

    renderArticles(filtered);
}

function restoreView() {
    const view = loadView();

    if (!view) {
        showHome();
        return;
    }

    if (view.type === "article") {
        showArticle(view.value);
    } else if (view.type === "category") {
        showCategory(view.value);
    } else {
        showHome();
    }
}

restoreView();
</script>

</body>
</html>
